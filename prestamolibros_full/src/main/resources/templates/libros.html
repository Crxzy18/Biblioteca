<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8"><title>Libros - BiblioApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head><body class="bg-light">
    
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-book-half"></i> BiblioApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/estudiantes">Estudiantes</a></li>
                <li class="nav-item"><a class="nav-link" href="/libros">Libros</a></li>
                <li class="nav-item"><a class="nav-link" href="/prestamos">Préstamos</a></li>
            </ul>
        </div>
    </div>
</nav>

    <div class="container">
        <h2 class="mb-4 fw-bold"><i class="bi bi-journal"></i> Gestión de Libros</h2>
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white fw-bold">Registrar / Editar Libro</div>
                    <div class="card-body">
                        <form th:action="@{/libros/save}" th:object="${libro}" method="post">
                            <div class="mb-3">
                                <label>ISBN</label>
                                <input type="text" th:field="*{isbn}" class="form-control" required/>
                            </div>
                            <div class="mb-3">
                                <label>Título</label>
                                <input type="text" th:field="*{titulo}" class="form-control" required/>
                            </div>
                            <div class="mb-3">
                                <label>Autor</label>
                                <input type="text" th:field="*{autor}" class="form-control" required/>
                            </div>
                            <div class="mb-3">
                                <label>Editorial</label>
                                <input type="text" th:field="*{editorial}" class="form-control" required/>
                            </div>
                            <div class="mb-3">
                                <label>Nº Páginas</label>
                                <input type="number" th:field="*{numPag}" class="form-control" required/>
                            </div>
                            <button type="submit" class="btn btn-success w-100"><i class="bi bi-save"></i> Guardar</button>
                            <a href="/libros" class="btn btn-light w-100 mt-2">Cancelar / Limpiar</a>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr><th>ISBN</th><th>Título</th><th>Autor</th><th>Editorial</th><th>Págs</th><th>Acciones</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="l : ${libros}">
                                    <td th:text="${l.isbn}"></td>
                                    <td th:text="${l.titulo}"></td>
                                    <td th:text="${l.autor}"></td>
                                    <td th:text="${l.editorial}"></td>
                                    <td th:text="${l.numPag}"></td>
                                    <td>
                                        <a th:href="@{/libros/edit/{id}(id=${l.isbn})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                                        <a th:href="@{/libros/delete/{id}(id=${l.isbn})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar?');"><i class="bi bi-trash"></i></a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body></html>
