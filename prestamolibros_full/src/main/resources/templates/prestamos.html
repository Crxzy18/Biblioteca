<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8"><title>Préstamos - BiblioApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head><body class="bg-light">
    
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-book-half"></i> BiblioApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/estudiantes">Estudiantes</a></li>
                <li class="nav-item"><a class="nav-link" href="/libros">Libros</a></li>
                <li class="nav-item"><a class="nav-link" href="/prestamos">Préstamos</a></li>
            </ul>
        </div>
    </div>
</nav>

    <div class="container">
        <h2 class="mb-4 fw-bold"><i class="bi bi-arrow-left-right"></i> Gestión de Préstamos</h2>
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white fw-bold">Nuevo Préstamo</div>
                    <div class="card-body">
                        <form th:action="@{/prestamos/save}" th:object="${prestamo}" method="post">
                            <div class="mb-3">
                                <label>Estudiante (Seleccionar)</label>
                                <select th:field="*{estudiante.documento}" class="form-select" required>
                                    <option value="">Seleccione estudiante...</option>
                                    <option th:each="e : ${estudiantes}" th:value="${e.documento}" th:text="${e.nombre + ' ' + e.apellido}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label>Libro (Seleccionar)</label>
                                <select th:field="*{libro.isbn}" class="form-select" required>
                                    <option value="">Seleccione libro...</option>
                                    <option th:each="l : ${libros}" th:value="${l.isbn}" th:text="${l.titulo + ' (' + l.autor + ')'}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label>Fecha del Préstamo</label>
                                <input type="date" th:field="*{fechaPrestamo}" class="form-control" required/>
                            </div>
                            <button type="submit" class="btn btn-warning w-100"><i class="bi bi-save"></i> Registrar Préstamo</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr><th>ID</th><th>Estudiante</th><th>Libro</th><th>Fecha</th><th>Acciones</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${prestamos}">
                                    <td th:text="${p.idPrestamo}"></td>
                                    <td th:text="${p.estudiante.nombre + ' ' + p.estudiante.apellido}"></td>
                                    <td th:text="${p.libro.titulo}"></td>
                                    <td th:text="${p.fechaPrestamo}"></td>
                                    <td>
                                        <a th:href="@{/prestamos/delete/{id}(id=${p.idPrestamo})}" class="btn btn-sm btn-outline-success" onclick="return confirm('¿Marcar como devuelto/eliminar?');"><i class="bi bi-check-circle"></i> Devolver</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body></html>
