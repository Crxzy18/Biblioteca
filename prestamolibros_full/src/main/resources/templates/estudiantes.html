<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8"><title>Estudiantes - BiblioApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head><body class="bg-light">
    
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-book-half"></i> BiblioApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/estudiantes">Estudiantes</a></li>
                <li class="nav-item"><a class="nav-link" href="/libros">Libros</a></li>
                <li class="nav-item"><a class="nav-link" href="/prestamos">Préstamos</a></li>
            </ul>
        </div>
    </div>
</nav>

    <div class="container">
        <h2 class="mb-4 fw-bold"><i class="bi bi-people"></i> Gestión de Estudiantes</h2>
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white fw-bold">Registrar / Editar Estudiante</div>
                    <div class="card-body">
                        <form th:action="@{/estudiantes/save}" th:object="${estudiante}" method="post">
                            <div class="mb-3">
                                <label>Documento</label>
                                <input type="text" th:field="*{documento}" class="form-control" required/>
                            </div>
                            <div class="mb-3">
                                <label>Nombre</label>
                                <input type="text" th:field="*{nombre}" class="form-control" required/>
                            </div>
                            <div class="mb-3">
                                <label>Apellido</label>
                                <input type="text" th:field="*{apellido}" class="form-control" required/>
                            </div>
                            <div class="mb-3">
                                <label>Email</label>
                                <input type="email" th:field="*{email}" class="form-control" required/>
                            </div>
                            <div class="mb-3">
                                <label>Teléfono</label>
                                <input type="text" th:field="*{telefono}" class="form-control" required/>
                            </div>
                            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-save"></i> Guardar</button>
                            <a href="/estudiantes" class="btn btn-light w-100 mt-2">Cancelar / Limpiar</a>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr><th>Doc</th><th>Nombre</th><th>Apellido</th><th>Email</th><th>Teléfono</th><th>Acciones</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${estudiantes}">
                                    <td th:text="${e.documento}"></td>
                                    <td th:text="${e.nombre}"></td>
                                    <td th:text="${e.apellido}"></td>
                                    <td th:text="${e.email}"></td>
                                    <td th:text="${e.telefono}"></td>
                                    <td>
                                        <a th:href="@{/estudiantes/edit/{id}(id=${e.documento})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                                        <a th:href="@{/estudiantes/delete/{id}(id=${e.documento})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar?');"><i class="bi bi-trash"></i></a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body></html>
